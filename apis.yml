description: prcxi (Suzhou Zhongxi Bioinformation Co., Ltd.) is a life-science automation company
  founded in 2014 and based in Suzhou, China. It builds liquid-handling systems (manual, semi-automatic,
  and fully automatic pipetting workstations such as the SC9000/SC9100/SC9200/SC9320 PRO series),
  custom laboratory automation solutions, and general lab equipment including shaking incubators.
  Its systems serve biopharmaceuticals, clinical diagnostics, public health, food safety, and
  agricultural breeding. Surfaced as a portfolio company of qiming; the company publishes no public
  developer/API surface, so this profile carries identity and domain-security signals only.
